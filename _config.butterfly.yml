# Butterfly 主题美化配置

# --------------------------------------
# 导航菜单
# --------------------------------------
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  说说: /shuoshuo/ || fas fa-comment-dots
  标签: /tags/ || fas fa-tags
  留言板: /message/ || fas fa-envelope-open-text
  关于我: /about/ || fas fa-user

# --------------------------------------
# 社交链接
# --------------------------------------
social:
  fab fa-github: https://github.com/ || Github || '#24292e'
  fas fa-envelope: mailto:im.liyue@outlook.com || Email || '#4a7dbe'
  fas fa-trophy: https://www.kaggle.com/ || Kaggle || '#20BEFF'

# --------------------------------------
# 图片设置
# --------------------------------------
favicon: /img/favicon.png
avatar:
  img: /img/wukong.jpg
  effect: false

disable_top_img: false

# 首页横幅
index_img: /img/DragonBall.png
default_top_img: /img/DragonBall.png

# 文章封面默认图
cover:
  index_enable: false
  aside_enable: false
  archives_enable: false

# --------------------------------------
# 首页设置
# --------------------------------------
# 打字机副标题
subtitle:
  enable: true
  effect: true
  typed_option:
  source: false
  sub:
    - TIME · MONEY
    - 一寸光阴一寸金 · 寸金难买寸光阴

# 文章布局：3=封面左右交替
index_layout: 3

# 文章摘要
index_post_content:
  method: 2
  length: 300

# --------------------------------------
# 代码块
# --------------------------------------
code_blocks:
  theme: ocean
  macStyle: true
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# --------------------------------------
# 文章设置
# --------------------------------------
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

related_post:
  enable: true
  limit: 6
  date_type: created

post_pagination: 1

# --------------------------------------
# 页脚
# --------------------------------------
footer:
  owner:
    enable: true
    since: 2024
  copyright:
    enable: true
    version: true
  custom_text: <p>分析个人的一些成长、体验、感受</p>

# --------------------------------------
# 侧边栏
# --------------------------------------
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: AI | 大模型 | 时序分析
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/
  card_announcement:
    enable: true
    title: 最近动态
    content: |
      <ul style="list-style:none;padding:0;margin:0;line-height:1.8;">
        <li>🎉 博客上线，欢迎交流</li>
        <li>📝 新增文章：讲讲动漫</li>
        <li>📝 新增文章：那些年，我玩过的游戏</li>
      </ul>
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: true
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# --------------------------------------
# 右下角按钮
# --------------------------------------
readmode: true

darkmode:
  enable: true
  button: true
  autoChangeMode: false

rightside_scroll_percent: true

# --------------------------------------
# 主题色
# --------------------------------------
theme_color:
  enable: true
  main: "#49B1F5"
  paginator: "#00c4b6"
  button_hover: "#FF7242"
  text_selection: "#00c4b6"
  link_color: "#49B1F5"
  meta_color: "#858585"
  hr_color: "#A4D8FA"
  code_foreground: "#F47466"
  code_background: "rgba(27, 31, 35, .05)"
  toc_color: "#00c4b6"
  blockquote_padding_color: "#49b1f5"
  blockquote_background_color: "#49b1f5"
  scrollbar_color: "#49b1f5"
  meta_theme_color_light: "#ffffff"
  meta_theme_color_dark: "#0d0d0d"

# --------------------------------------
# 美化效果
# --------------------------------------
rounded_corners_ui: true
text_align_justify: false

mask:
  header: true
  footer: true

# 加载动画
preloader:
  enable: true
  source: 2
  pace_css_url:

enter_transitions: true

display_mode: light

# 文章标题美化
beautify:
  enable: true
  field: post
  title_prefix_icon: '\f0c1'
  title_prefix_icon_color: '#F47466'

# 分割线图标
hr_icon:
  enable: true
  icon: '\f066'
  icon_top:

# 全局字体
font:
  global_font_size:
  code_font_size:
  font_family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif
  code_font_family: Consolas, Monaco, "Andale Mono", monospace

# --------------------------------------
# 背景特效
# --------------------------------------
# 飘动彩带
canvas_fluttering_ribbon:
  enable: true
  mobile: false

# --------------------------------------
# 搜索
# --------------------------------------
search:
  use: local_search
  placeholder: 搜索文章...
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: false

# --------------------------------------
# 访问量统计
# --------------------------------------
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# --------------------------------------
# 复制设置
# --------------------------------------
copy:
  enable: true
  copyright:
    enable: false
    limit_count: 150

# --------------------------------------
# 评论系统
# --------------------------------------
comments:
  use: waline
  lazyload: true
  count: true
  card_post_count: false

waline:
  serverURL: https://comment.bayesly.me
  lang: zh-CN
  locale:
    placeholder: 欢迎留言...
  emoji: true
  requiredMeta: ['nick', 'mail']
  pageSize: 10

# --------------------------------------
# 分类/标签页UI
# --------------------------------------
category_ui: index
tag_ui: index

# --------------------------------------
# 404页面
# --------------------------------------
error_404:
  enable: true
  subtitle: '页面未找到'
  background: /img/error-page.png
