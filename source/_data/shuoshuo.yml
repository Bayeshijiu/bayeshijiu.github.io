    2026年7月10号，一起参加年会表演的一个小伙伴离职了——算是被辞退的吧。挺聊得来的，年会的时候聊天，人挺不错。没想到这么快就要走了。虽然当时他就说了，他的leader已经在让他看机会了。哎，真是的，感觉很多兢兢业业干活的人，总是受到不太公平的待遇。在他走的前一天，楼下送了下他。感觉他心态还是挺不错的，也有了几个小公司的offer。祝他未来一切顺利吧。
