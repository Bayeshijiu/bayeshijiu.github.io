    这个月上了4节游泳课，终于把蛙泳学会了。另外上了两次单次卡。感觉有老师教确实学得比较快，而且就算动作不会、不对，游不起来，也没那么着急，能感觉到自己是在往对的方向前进。有一个女生比我少上一节课，练得可能要少一点，应该没我学得快吧？哈哈。最后一节课，教练过来聊天。他说他老婆孩子也是在外地，他可能几个月才会聚一次，也挺不容易的。小孩已经上初中了。他说孩子长大了，和他也没那么亲了。感觉大家都挺不容易的。
